name: Lint and test
on: [push]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rebuildr-backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: 📦 Install dependencies
        run: npm i
      - name: 🕵️ Type checking
        run: npm run type-check
      - name: Linting
        run: npm run lint
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rebuildr-app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: 📦 Install dependencies
        run: npm i
      - name: Linting
        run: npm run lint
